<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaiZee Store | Spin & Redeem</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Firebase Scripts (လိုအပ်သော SDK များ) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
      user-select: none;
    }
    .header-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .point-badge {
      background: #4f46e5;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-dim);
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .item-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .item-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }
    .btn-action {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }
    .admin-panel {
      background: #334155;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .admin-input {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-card">
    <div id="username" style="font-weight: bold;">Loading...</div>
    <div class="point-badge">💎 <span id="user-points">0</span> Points</div>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('shop')">🛒 Redeem Shop</button>
    <button class="tab-btn" onclick="switchTab('spin')">🎡 Spin Wheel (<span id="spin-count">0</span>)</button>
  </div>

  <!-- Admin Panel (Only visible to Admin) -->
  <div id="admin-section" class="admin-panel">
    <h3 style="color:#c084fc; margin-bottom:10px;">⚙️ Admin (Add Item)</h3>
    <input type="text" id="add-name" class="admin-input" placeholder="Item Name (e.g. Dough Fruit)">
    <input type="text" id="add-img" class="admin-input" placeholder="Image Direct URL">
    <input type="number" id="add-points" class="admin-input" placeholder="Point Cost">
    <button class="btn-action" style="background:#10b981;" onclick="addNewFruit()">+ Add Item to Shop</button>
  </div>

  <!-- SHOP TAB -->
  <div id="tab-shop" class="tab-content active">
    <div class="shop-grid" id="fruit-container">Loading items...</div>
  </div>

  <!-- SPIN TAB -->
  <div id="tab-spin" class="tab-content" style="text-align: center;">
    <div style="padding: 40px var(--card-bg); border-radius: 12px; background: var(--card-bg);">
      <h2>🎡 Daily Spin Wheel</h2>
      <p style="color: var(--text-dim);">Spin the wheel to earn points!</p>
      <button class="btn-action" style="background:#8b5cf6; padding: 12px; font-size: 16px;" onclick="doSpin()">SPIN NOW</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 1. Firebase Config
    const firebaseConfig = {
      databaseURL: "https://naizee-store-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Admin Telegram ID (အစ်ကို့ Telegram ID)
    const ADMIN_TELEGRAM_ID = 7586561132;

    const user = tg.initDataUnsafe?.user || { id: 99999, first_name: "Customer" };
    document.getElementById("username").innerText = user.first_name;

    // Admin စိစစ်ခြင်း
    if (user.id == ADMIN_TELEGRAM_ID) {
      document.getElementById("admin-section").style.display = "block";
    }

    let userPoints = 0;
    let availableSpins = 0;

    // Firebase Sync User Data
    db.ref('users/' + user.id).on('value', (snapshot) => {
      const data = snapshot.val() || { points: 0, spins: 1 };
      userPoints = data.points || 0;
      availableSpins = data.spins !== undefined ? data.spins : 1;
      document.getElementById("user-points").innerText = userPoints;
      document.getElementById("spin-count").innerText = availableSpins;
    });

    // Firebase Sync Items Data
    let fruitsList = {};
    db.ref('fruits').on('value', (snapshot) => {
      fruitsList = snapshot.val() || {};
      renderShop();
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if (tabName === 'shop') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-shop').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-spin').classList.add('active');
      }
    }

    function renderShop() {
      const container = document.getElementById("fruit-container");
      container.innerHTML = "";
      
      const keys = Object.keys(fruitsList);
      if (keys.length === 0) {
        container.innerHTML = "<p style='grid-column: span 2; color:#94a3b8;'>No items available in shop.</p>";
        return;
      }

      keys.forEach(key => {
        const item = fruitsList[key];
        container.innerHTML += `
          <div class="item-card">
            <img src="${item.img || 'https://via.placeholder.com/100'}" alt="${item.name}">
            <h4 style="margin: 8px 0 4px 0;">${item.name}</h4>
            <p style="margin:0; font-size:12px; color:#a78bfa;">💎 ${item.points} Points</p>
            <button class="btn-action" onclick="redeemItem('${item.name}', ${item.points})">Redeem</button>
          </div>
        `;
      });
    }

    function addNewFruit() {
      const name = document.getElementById("add-name").value;
      const img = document.getElementById("add-img").value;
      const points = parseInt(document.getElementById("add-points").value);

      if (!name || !points) {
        alert("Please enter Name and Points!");
        return;
      }

      const newRef = db.ref('fruits').push();
      newRef.set({ name, img, points }, (err) => {
        if (!err) {
          alert("Item Added Successfully!");
          document.getElementById("add-name").value = "";
          document.getElementById("add-img").value = "";
          document.getElementById("add-points").value = "";
        }
      });
    }

    function redeemItem(itemName, cost) {
      if (userPoints < cost) {
        alert("Not enough points!");
        return;
      }

      db.ref('users/' + user.id).update({
        points: userPoints - cost
      });

      db.ref('orders').push({
        userId: user.id,
        userName: user.first_name,
        item: itemName,
        cost: cost,
        timestamp: Date.now()
      });

      alert(`Redeemed ${itemName} successfully!`);
    }

    function doSpin() {
      if (availableSpins <= 0) {
        alert("No spins left today!");
        return;
      }

      const wonPoints = Math.floor(Math.random() * 50) + 10;
      db.ref('users/' + user.id).update({
        points: userPoints + wonPoints,
        spins: availableSpins - 1
      });

      alert(`You won ${wonPoints} Points! 🎉`);
    }
  </script>
</body>
</html>
